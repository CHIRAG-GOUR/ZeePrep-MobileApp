name: Android CI & App Config Verification

on:
  pull_request:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'
      - '.github/workflows/web*.yml'

jobs:
  validate-android:
    name: 📱 Validate Android App Configuration & Types
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci --no-audit --no-fund

      - name: 🔍 TypeScript Typecheck
        run: npm run typecheck

      - name: ⚙️ Validate Expo & Android App Config
        run: npx expo config --type public

      - name: 🛡️ Verify Package ID & Version Invariants
        run: |
          node -e "
            const app = require('./app.json');
            const pkg = app.expo.android.package;
            const vCode = app.expo.android.versionCode;
            const version = app.expo.version;
            console.log('App Name:', app.expo.name);
            console.log('Package ID:', pkg);
            console.log('Version:', version);
            console.log('Version Code:', vCode);
            if (pkg !== 'com.skillizee.zeeprep') {
              console.error('ERROR: Android package ID mismatch! Expected com.skillizee.zeeprep');
              process.exit(1);
            }
            if (!vCode || vCode < 1) {
              console.error('ERROR: Invalid versionCode!');
              process.exit(1);
            }
            console.log('✓ Android app identity verified.');
          "
