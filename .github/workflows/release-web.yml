name: Release Web App (Controlled Deployment)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Hosting Target'
        required: true
        default: 'hostinger'
        type: choice
        options:
          - 'hostinger'
          - 'firebase'
          - 'both'
      environment:
        description: 'Deployment Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - 'production'
          - 'preview'
      confirm_deploy:
        description: 'Type "DEPLOY" to confirm release'
        required: true
        default: 'DEPLOY'

jobs:
  release-web:
    name: 🚀 Build & Deploy Web Application
    runs-on: ubuntu-latest

    steps:
      - name: 🛡️ Safety Confirmation Check
        run: |
          if [ "${{ github.event.inputs.confirm_deploy }}" != "DEPLOY" ]; then
            echo "❌ Deployment aborted: Confirmation token does not match 'DEPLOY'."
            exit 1
          fi
          echo "✓ Manual release confirmation accepted."

      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci --no-audit --no-fund

      - name: 🔍 TypeScript Verification
        run: npm run typecheck

      - name: 🏗️ Build Production Bundle (Expo Web Export)
        env:
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
          EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.EXPO_PUBLIC_GEMINI_API_KEY }}
        run: |
          npm run build:web
          node scripts/generate_static_legal_pages.mjs

      - name: 📄 Inject Clean-URL SPA .htaccess Routing & Cache Headers
        run: |
          cat << 'EOF' > dist/.htaccess
          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /

            # 1. Directory index
            RewriteCond %{REQUEST_FILENAME} -d
            RewriteRule ^ - [L]

            # 2. Direct HTML file rewrite
            RewriteCond %{DOCUMENT_ROOT}/$1.html -f [OR]
            RewriteCond %{REQUEST_FILENAME}.html -f
            RewriteRule ^(.*)$ $1.html [L]

            # 3. Existing static files
            RewriteCond %{REQUEST_FILENAME} -f
            RewriteRule ^ - [L]

            # 4. Dynamic SPA fallback
            RewriteRule ^index\.html$ - [L]
            RewriteRule . /index.html [L]
          </IfModule>

          <IfModule mod_headers.c>
            <FilesMatch "\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$">
              Header set Cache-Control "max-age=31536000, public, immutable"
            </FilesMatch>
            <FilesMatch "\.(html|json)$">
              Header set Cache-Control "no-cache, no-store, must-revalidate"
            </FilesMatch>
          </IfModule>
          EOF

      # Target: Hostinger via FTPS
      - name: 🌐 Upload to Hostinger via Secure FTPS
        if: ${{ github.event.inputs.target == 'hostinger' || github.event.inputs.target == 'both' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          security: loose
          log-level: verbose
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_TARGET_DIR || 'public_html/' }}/
          dangerous-clean-slate: false
          state-name: .ftp-deploy-sync-state-zeeprep.json
          timeout: 600000
          exclude: |
            SAT/**
            sat/**
            sat.skillizee.io/**
            SAT.skillizee.io/**
            .ftp-deploy-sync-state-sat.json
            .ftp-deploy-sync-state-*.json
            **/*.php
            **/cgi-bin/**

      # Target: Firebase Hosting
      - name: 🔥 Deploy to Firebase Hosting (${{ github.event.inputs.environment }})
        if: github.event.inputs.target == 'firebase' || github.event.inputs.target == 'both'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ZEEPREP01 }}'
          channelId: ${{ github.event.inputs.environment == 'production' && 'live' || 'preview' }}
          projectId: zeeprep01
          target: zeeprep-app

      - name: 📋 Deployment Summary
        run: |
          echo "===================================================="
          echo "🎉 ZEEPREP WEB DEPLOYMENT SUCCESSFUL"
          echo "Target: ${{ github.event.inputs.target }}"
          echo "Environment: ${{ github.event.inputs.environment }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Timestamp: $(date -u)"
          echo "===================================================="
