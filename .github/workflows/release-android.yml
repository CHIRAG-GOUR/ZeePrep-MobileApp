name: Release Android (Native Gradle & Play Console)

on:
  workflow_dispatch:
    inputs:
      artifact_type:
        description: 'Artifact to Build'
        required: true
        default: 'aab_bundle'
        type: choice
        options:
          - 'aab_bundle'
          - 'apk_release'
      confirm_build:
        description: 'Type "BUILD" to confirm'
        required: true
        default: 'BUILD'

jobs:
  build-native-android:
    name: 📱 Build Native Android (${{ github.event.inputs.artifact_type }})
    runs-on: ubuntu-latest

    steps:
      - name: 🛡️ Confirmation Check
        run: |
          if [ "${{ github.event.inputs.confirm_build }}" != "BUILD" ]; then
            echo "❌ Build aborted: Confirmation token does not match 'BUILD'."
            exit 1
          fi
          echo "✓ Manual build confirmation accepted."

      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 📦 Install Dependencies
        run: npm ci --no-audit --no-fund

      - name: 🔍 TypeScript Verification
        run: npm run typecheck

      - name: 🔑 Restore Android Release Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/my-release-key.keystore
            echo "✓ Restored release keystore from GitHub Secret ANDROID_KEYSTORE_BASE64."
          elif [ -f "android/app/my-release-key.keystore" ]; then
            echo "✓ Using existing android/app/my-release-key.keystore."
          elif [ -f "my-release-key.keystore" ]; then
            cp my-release-key.keystore android/app/my-release-key.keystore
            echo "✓ Copied root my-release-key.keystore into android/app/."
          else
            echo "Restoring release keystore from verified embedded backup..."
            cat << 'EOF' | tr -d '\r\n ' | base64 -d > android/app/my-release-key.keystore
          
          EOF
            echo "✓ Restored release keystore from embedded backup."
          fi
          ls -lh android/app/my-release-key.keystore


      - name: 🔨 Compile Android Artifact with Gradle
        run: |
          cd android
          chmod +x gradlew
          if [ "${{ github.event.inputs.artifact_type }}" = "aab_bundle" ]; then
            echo "Building Android App Bundle (.aab)..."
            ./gradlew bundleRelease -x lint -x test
          else
            echo "Building Standalone Release APK (.apk)..."
            ./gradlew assembleRelease -x lint -x test
          fi

      - name: 📦 Upload Build Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: zeeprep-${{ github.event.inputs.artifact_type }}-${{ github.sha }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: 📋 Android Build Summary
        run: |
          echo "===================================================="
          echo "🎉 NATIVE GRADLE ANDROID BUILD SUCCESSFUL"
          echo "Artifact Type: ${{ github.event.inputs.artifact_type }}"
          echo "Target Package: com.skillizee.zeeprep"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Timestamp: $(date -u)"
          echo "===================================================="
          echo "The generated artifact is attached to this GitHub Actions run."
          echo "🛑 Hard Stop: Manual approval required before Play Store rollout!"
